<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aster Vault — Admin Console</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,650&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg:#0A0A12; --surface:#131320; --surface-alt:#171727; --raised:#1E1E32;
    --border:#26263A; --border-hi:#34324E;
    --text:#F1F0F8; --text-2:#9A9AB4; --text-3:#5A5A78;
    --violet:#C3B4FF; --azure:#6E9CF5; --jade:#4FD1A5; --negative:#E28787;
    --aurora: linear-gradient(135deg, var(--violet), var(--azure) 55%, var(--jade));
    --font-display:'Fraunces', ui-serif, Georgia, serif;
    --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --font-sans:'Inter', ui-sans-serif, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  #root {
    background:
      radial-gradient(120% 90% at 50% -10%, #1E1A38 0%, transparent 55%),
      radial-gradient(140% 110% at 5% 105%, #14523D 0%, transparent 65%),
      radial-gradient(90% 70% at 95% 60%, #0F3D2E 0%, transparent 55%),
      var(--bg);
    color: var(--text); font-family: var(--font-sans); min-height: 100vh; padding: 26px 24px 60px;
  }
  input, button { font-family: inherit; }
  ::selection { background: #6E9CF544; }
  .wrap { max-width: 920px; margin: 0 auto; }

  .banner { background: linear-gradient(90deg, var(--border-hi), #17152A, var(--border-hi)); border: 1px solid var(--border); color: var(--negative);
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .6px; text-align: center; padding: 9px 16px; border-radius: 10px; margin-bottom: 20px; }

  .topbar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom: 18px; flex-wrap: wrap; }
  .back-link { font-size: 11.5px; color: var(--violet); text-decoration: none; border: 1px solid var(--border); background: var(--surface); padding: 6px 13px; border-radius: 999px; }
  .back-link:hover { border-color: var(--border-hi); }

  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; flex-wrap: wrap; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .mark { width: 38px; height: 38px; border-radius: 11px; background: var(--aurora); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 20px -6px #6E9CF566; font-family: var(--font-display); font-weight: 650; font-size: 16px; color: #0A0A12; flex-shrink: 0; }
  .brand h1 { font-family: var(--font-display); font-size: 20px; margin: 0; }
  .brand p { font-size: 11.5px; color: var(--text-3); margin: 2px 0 0; }

  .btn { cursor: pointer; border-radius: 10px; font-size: 13px; font-weight: 600; padding: 10px 16px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); display: inline-flex; align-items: center; gap: 7px;
    transition: transform .16s cubic-bezier(.34,1.4,.6,1), filter .16s ease; }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: scale(.95); filter: brightness(1.18); }
  .btn-accent { border: none; color: #0A0A12; background: var(--aurora); box-shadow: 0 10px 22px -10px #6E9CF599; }
  .btn-danger { border-color: #E2878740; color: var(--negative); background: #E2878710; }
  .btn-sm { padding: 7px 12px; font-size: 12px; border-radius: 8px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .stat { background: linear-gradient(160deg, var(--surface), var(--surface-alt)); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; box-shadow: 0 1px 0 #FFFFFF0A inset; }
  .stat .label { font-size: 10.5px; color: var(--text-2); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .stat .value { font-family: var(--font-mono); font-size: 20px; }

  .section-header-row { display: flex; align-items: center; justify-content: space-between; margin: 26px 0 12px; }
  .section-label { font-size: 11px; color: var(--text-2); text-transform: uppercase; letter-spacing: 1.1px; font-weight: 500; margin: 0; }
  .batch-actions { display: flex; align-items: center; gap: 10px; }

  .accounts { display: flex; flex-direction: column; gap: 10px; }
  .account { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; transition: border-color .2s ease; }
  .account.open { border-color: var(--border-hi); }
  .account-head { display: flex; align-items: center; gap: 14px; padding: 14px 16px; cursor: pointer; }
  
  .account-select { width: 18px; height: 18px; accent-color: var(--azure); cursor: pointer; margin: 0; flex-shrink: 0; }

  .avatar { width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; background: linear-gradient(160deg, var(--raised), var(--surface-alt)); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 14px; color: var(--violet); }
  .account-name { font-size: 14px; font-weight: 500; display:flex; align-items:center; gap:7px; }
  .registered-tag { font-size: 9.5px; color: var(--jade); font-weight: 700; letter-spacing: .4px; display: inline-flex; align-items: center; gap: 3px; }
  .registered-tag .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--jade); display: inline-block; }
  .account-email { font-size: 11.5px; color: var(--text-3); font-family: var(--font-mono); margin-top: 1px; }
  .referred-by { font-size: 10.5px; color: var(--jade); margin-top: 3px; display: flex; align-items: center; gap: 4px; }
  .invite-badge { font-size: 10.5px; color: var(--violet); background: #C3B4FF1A; padding: 2.5px 8px; border-radius: 999px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; position: relative; }
  .streak-badge { font-size: 10.5px; padding: 2.5px 8px; border-radius: 999px; font-weight: 700; font-family: var(--font-mono); display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .streak-badge.cooldown { color: #FF9A6B; background: #FF6B4A1A; }
  .streak-badge.ready { color: var(--jade); background: #4FD1A51A; }
  .streak-badge.none { color: var(--text-3); background: #9A9AB414; }
  .invite-new-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--jade); box-shadow: 0 0 0 0 rgba(79,209,165,0.6); animation: invite-pulse 1.6s ease-in-out infinite; flex-shrink: 0; }
  @keyframes invite-pulse { 0% { box-shadow: 0 0 0 0 rgba(79,209,165,0.55); } 70% { box-shadow: 0 0 0 6px rgba(79,209,165,0); } 100% { box-shadow: 0 0 0 0 rgba(79,209,165,0); } }
  .account-value { font-family: var(--font-mono); font-size: 15px; margin-left: auto; text-align: right; }
  .account-value .sub { font-size: 10.5px; color: var(--text-3); margin-top: 2px; }
  .chev { color: var(--text-3); transition: transform .25s ease; flex-shrink: 0; }
  .account.open .chev { transform: rotate(90deg); color: var(--violet); }

  .account-body { display: none; padding: 4px 16px 18px; border-top: 1px solid var(--border); }
  .account.open .account-body { display: block; }

  .asset-editor { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 14px 0; }
  .asset-field { background: var(--surface-alt); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .asset-field label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); margin-bottom: 7px; }
  .coin-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .asset-field input { width: 100%; background: var(--raised); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; color: var(--text); font-family: var(--font-mono); font-size: 13.5px; outline: none; }
  .asset-field input:focus { border-color: var(--azure); }
  .usd-preview { font-family: var(--font-mono); font-size: 11px; color: var(--jade); margin-top: 6px; }

  .addr-editor { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .addr-field { background: var(--surface-alt); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .addr-field label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); margin-bottom: 7px; }
  .addr-field input { width: 100%; background: var(--raised); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; color: var(--text); font-family: var(--font-mono); font-size: 12px; outline: none; margin-bottom: 9px; }
  .addr-field input:focus { border-color: var(--azure); }
  .qr-row { display: flex; align-items: center; gap: 8px; }
  .qr-thumb { width: 32px; height: 32px; border-radius: 6px; object-fit: cover; border: 1px solid var(--border); background: #F4F1EA; flex-shrink: 0; }
  .qr-thumb-empty { width: 32px; height: 32px; border-radius: 6px; border: 1px dashed var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--text-3); }
  .upload-label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); font-size: 11px; font-weight: 600; white-space: nowrap; }
  .upload-label:hover { border-color: var(--border-hi); color: var(--text); }
  .qr-clear-btn { background: none; border: none; color: var(--negative); cursor: pointer; padding: 6px; flex-shrink: 0; }

  .editor-total { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--border-hi); border-radius: 10px; padding: 10px 13px; margin: 2px 0 14px; font-size: 12.5px; color: var(--text-2); }
  .editor-total .amount { font-family: var(--font-mono); font-size: 15px; color: var(--text); }

  .row-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }

  .activity-title { font-size: 11px; color: var(--text-2); text-transform: uppercase; letter-spacing: 1px; margin: 18px 0 8px; }
  .activity-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .activity-item:last-child { border-bottom: none; }
  .activity-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .activity-item .who { color: var(--text-2); font-size: 11px; margin-left: auto; font-family: var(--font-mono); }
  .activity-empty { font-size: 12px; color: var(--text-3); padding: 6px 0 2px; }

  .toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); background: var(--raised); border: 1px solid var(--border-hi); color: var(--text);
    font-size: 13px; padding: 10px 18px; border-radius: 999px; box-shadow: 0 10px 28px #00000066; opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 10; }
  .toast.show { opacity: 1; }

  .footnote { font-size: 11.5px; color: var(--text-3); line-height: 1.6; margin-top: 30px; max-width: 640px; }
</style>
</head>
<body>
<div id="root"></div>

<script>
(function () {
  const DB_KEY = "aster-vault-db";
  const ASSET_DEFS = [
    { id: "btc", name: "Bitcoin", symbol: "BTC", price: 97230, color: "#F7931A" },
    { id: "eth", name: "Ethereum", symbol: "ETH", price: 3510, color: "#8FA8FF" },
    { id: "usdc", name: "USD Coin", symbol: "USDC", price: 1, color: "#4FB2F0" },
  ];
  const DEFAULT_ACCOUNTS = () => ({});

  const SEND_ELIGIBILITY_DAYS = 45;
  function sendEligibility(account) {
    const created = account?.createdAt || Date.now();
    const ageDays = Math.floor((Date.now() - created) / 86400000);
    return {
      eligible: ageDays >= SEND_ELIGIBILITY_DAYS,
      daysRemaining: Math.max(0, SEND_ELIGIBILITY_DAYS - ageDays),
    };
  }

  const STREAK_COOLDOWN_MS = 24 * 60 * 60 * 1000;
  function streakInfo(account) {
    const last = account?.lastStreakAt;
    if (!last) return { state: "none" };
    const remaining = STREAK_COOLDOWN_MS - (Date.now() - last);
    if (remaining > 0) {
      const h = Math.floor(remaining / 3600000);
      const m = Math.floor((remaining % 3600000) / 60000);
      return { state: "cooldown", label: `${h}h ${m}m left` };
    }
    return { state: "ready" };
  }

  const SOURCES = {
    btc: ["Coinbase", "Binance", "External wallet"],
    eth: ["Coinbase", "Kraken", "External wallet"],
    usdc: ["Circle", "Coinbase", "External wallet"],
  };

  const ICONS = {
    reset: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
    chevron: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
    check: '<svg width="14" height="14" viewBox="0 0 24 24"
