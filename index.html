<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aster Vault</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,650&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg:#0A0A12; --surface:#131320; --surface-alt:#171727; --raised:#1E1E32;
    --border:#26263A; --border-hi:#34324E;
    --text:#F1F0F8; --text-2:#9A9AB4; --text-3:#5A5A78;
    --violet:#C3B4FF; --azure:#6E9CF5; --jade:#4FD1A5; --negative:#E28787;
    --aurora: linear-gradient(135deg, var(--violet), var(--azure) 55%, var(--jade));
    --aurora-text: linear-gradient(120deg, var(--violet), var(--azure) 70%, var(--jade));
    --font-display:'Fraunces', ui-serif, Georgia, serif;
    --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --font-sans:'Inter', ui-sans-serif, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: var(--font-sans); background: #05050A; padding: 0; }
  button, input { font-family: inherit; }
  ::selection { background: #6E9CF544; }

  #root { width: 100%; margin: 0 auto; min-height: 100dvh; }

  .phone {
    background:
      radial-gradient(120% 90% at 50% -10%, #1E1A38 0%, transparent 55%),
      radial-gradient(140% 110% at 5% 105%, #14523D 0%, transparent 65%),
      radial-gradient(90% 70% at 95% 60%, #0F3D2E 0%, transparent 55%),
      var(--bg);
    color: var(--text); width: 100%; min-height: 100dvh; overflow: hidden;
    border-radius: 0; border: none; box-shadow: none;
    position: relative;
  }
  .grain { position:absolute; inset:0; opacity:.035; mix-blend-mode:overlay; pointer-events:none;
    background-image:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNjAiIGhlaWdodD0iMTYwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC44NSIgbnVtT2N0YXZlcz0iMiIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNuKSIvPjwvc3ZnPg=="); background-size:160px 160px; }

  .banner { grid-area:banner; background: linear-gradient(90deg, var(--border-hi), #17152A, var(--border-hi)); border-bottom:1px solid var(--border);
    padding:8px 16px; font-size:10.5px; font-family:var(--font-mono); color:var(--violet); text-align:center; letter-spacing:.6px; }

  .header { grid-area:header; padding:22px 22px 18px; display:flex; align-items:center; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:11px; }
  .mark { width:34px; height:34px; border-radius:10px; background:var(--aurora); display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 16px -4px #6E9CF566; flex-shrink:0; font-family:var(--font-display); font-weight:650; font-size:15px; color:#0A0A12; }
  .brand h1 { font-family:var(--font-display); font-size:17.5px; margin:0; line-height:1.1; font-weight:500; }
  .brand p { font-size:10.5px; color:var(--text-3); margin:1px 0 0; letter-spacing:.4px; }
  .icon-btn { background:var(--surface); border:1px solid var(--border); border-radius:10px; width:34px; height:34px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-2); }

  .body { grid-area:body; padding: 0 22px 22px; min-height: 440px; }

  .wv-btn { -webkit-tap-highlight-color:transparent; transition:transform .16s cubic-bezier(.34,1.4,.6,1), filter .16s ease, box-shadow .25s ease; cursor:pointer; }
  .wv-btn:hover { filter:brightness(1.08); }
  .wv-btn:active { transform:scale(.93); filter:brightness(1.15); }
  .wv-accent { box-shadow:0 0 0 0 rgba(110,156,245,.55); }
  .wv-accent:active { transform:scale(.95); box-shadow:0 0 0 9px rgba(110,156,245,0); transition:box-shadow .55s ease, transform .16s cubic-bezier(.34,1.4,.6,1); }
  .wv-row:hover { border-color: var(--border-hi) !important; }

  .eyebrow { font-size:11px; color:var(--text-2); letter-spacing:1.1px; text-transform:uppercase; font-weight:500; margin-bottom:11px; display:flex; align-items:center; justify-content:space-between; }
  .balance-figure { font-family:var(--font-mono); font-size:37px; font-weight:500; letter-spacing:-.6px; line-height:1.05;
    background-image:var(--aurora-text); -webkit-background-clip:text; background-clip:text; color:transparent; }

  .actions-row { display:flex; gap:10px; margin-bottom:8px; }
  .btn-action { flex:1; display:flex; align-items:center; justify-content:center; gap:8px; padding:13px 0; border-radius:12px; font-size:13.5px; font-weight:600; border:1px solid var(--border); background:transparent; color:var(--text); }
  .btn-action.primary { border:none; background:var(--aurora); color:#0A0A12; box-shadow:0 12px 26px -12px #6E9CF599; }

  .divider { height:1px; background:linear-gradient(90deg, transparent, var(--border), transparent); margin:22px 0; }

  .asset-list { border:1px solid var(--border); border-radius:16px; overflow:hidden; margin-bottom:24px; }
  .asset-row { padding:14px; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--border); }
  .asset-row:last-child { border-bottom:none; }
  .asset-name { font-size:14px; font-weight:500; }
  .asset-amt { font-family:var(--font-mono); font-size:12px; color:var(--text-2); }
  .asset-usd { font-family:var(--font-mono); font-size:13.5px; text-align:right; }

  .pill { font-family:var(--font-mono); font-size:11px; padding:3.5px 8px; border-radius:999px; letter-spacing:.3px; white-space:nowrap; display:inline-flex; align-items:center; gap:3px; }
  .pill.pos { color:var(--jade); background:#4FD1A51A; }
  .pill.neg { color:var(--negative); background:#E287871A; }
  .pill.mut { color:var(--text-2); background:#9A9AB41A; }

  .lines-card { position:relative; overflow:hidden; height:120px; margin-bottom:24px; padding:0; background:#05050C; }
  .lines-grid {
    position:absolute; inset:0;
    background-image:
      linear-gradient(#FFFFFF0A 1px, transparent 1px),
      linear-gradient(90deg, #FFFFFF0A 1px, transparent 1px);
    background-size: 26px 26px;
  }
  .lines-track { position:absolute; inset:0; display:flex; width:200%; animation: lines-scroll 26s linear infinite; }
  .lines-track svg { flex-shrink:0; width:50%; height:100%; display:block; }
  @keyframes lines-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .lines-crosshair-h { position:absolute; left:0; right:0; top:38%; height:0; border-top:1px dashed #FFFFFF2A; }
  .lines-crosshair-v { position:absolute; top:0; bottom:0; left:62%; width:0; border-left:1px dashed #FFFFFF2A; }
  .lines-note { position:absolute; bottom:8px; right:12px; font-size:9.5px; color:var(--text-3); font-family:var(--font-mono); background:#05050C99; padding:2px 8px; border-radius:999px; }

  .card { background:linear-gradient(160deg, var(--surface), var(--surface-alt)); border:1px solid var(--border); border-radius:16px;
    box-shadow:0 1px 0 #FFFFFF0A inset, 0 16px 28px -18px #000000A0, 0 2px 6px -2px #00000060; }

  .tx-row { display:flex; align-items:center; gap:12px; padding:10px 12px; margin-bottom:6px; cursor:pointer; }
  .tx-icon { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .tx-main { flex:1; min-width:0; }
  .tx-title { font-size:13px; }
  .tx-sub { font-size:11px; color:var(--text-3); font-family:var(--font-mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tx-right { text-align:right; }
  .tx-amt { font-family:var(--font-mono); font-size:13px; }
  .tx-time { font-size:10.5px; color:var(--text-3); }

  .empty { padding:24px 16px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:9px; }
  .empty .ic { width:38px; height:38px; border-radius:50%; background:linear-gradient(160deg, var(--raised), var(--surface-alt)); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; }
  .empty .t { font-size:13px; color:var(--text); font-weight:500; }
  .empty .s { font-size:11.5px; color:var(--text-3); max-width:230px; line-height:1.5; }

  .field-label { display:block; font-size:11.5px; color:var(--text-2); margin-bottom:8px; letter-spacing:.3px; font-weight:500; }
  .field-input { width:100%; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 13px; color:var(--text); font-size:13.5px; outline:none; }
  .field-input:focus { border-color:var(--azure); }

  .back-header { display:flex; align-items:center; gap:10px; padding:16px 0 20px; }
  .back-btn { background:var(--surface); border:1px solid var(--border); border-radius:8px; width:30px; height:30px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text); }
  .back-title { font-family:var(--font-display); font-size:19px; }

  .chip-row { display:flex; gap:8px; margin-bottom:16px; }
  .chip { flex:1; padding:11px 6px; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:5px; font-size:11.5px; }
  .chip.active { border-color:var(--azure); background:#6E9CF51A; }
  .chip.pillshape { flex:none; padding:7.5px 15px; border-radius:999px; }

  .nav { grid-area:nav; position:relative; display:flex; border-top:1px solid var(--border); background:linear-gradient(180deg, var(--surface), var(--surface-alt)); padding:0 6px; }
  .nav-indicator { position:absolute; top:7px; bottom:9px; left:calc(var(--nav-idx, 0) * (100% / var(--nav-count, 4)) + 6px); width:calc(100% / var(--nav-count, 4) - 12px); border-radius:12px; background:linear-gradient(160deg, #6E9CF51C, #4FD1A512); border:1px solid #6E9CF530; transition:left .38s cubic-bezier(.22,1,.36,1); pointer-events:none; }
  .nav-item { flex:1; background:none; border:none; cursor:pointer; padding:12px 4px 13px; display:flex; flex-direction:column; align-items:center; gap:4px; position:relative; z-index:1; color:var(--text-3); }
  .nav-item.active { color:var(--violet); }
  .nav-item span { font-size:10.5px; }

  .toast { position:absolute; bottom:78px; left:50%; transform:translateX(-50%); background:var(--raised); border:1px solid var(--border-hi); color:var(--text);
    font-size:12.5px; padding:9px 16px; border-radius:999px; white-space:nowrap; box-shadow:0 8px 24px #00000066; z-index:5; opacity:0; pointer-events:none; transition:opacity .25s ease; }
  .toast.show { opacity:1; }

  .modal-backdrop { position:absolute; inset:0; background:#05050ACC; backdrop-filter: blur(3px); display:flex; align-items:flex-end; z-index:10; }
  .modal-sheet { width:100%; background:linear-gradient(160deg, var(--surface), var(--surface-alt)); border:1px solid var(--border-hi); border-radius:20px 20px 0 0; padding:20px 22px 26px; max-height:85%; overflow-y:auto; }
  .modal-close { width:30px; height:30px; border-radius:8px; background:var(--raised); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text); }

  .center-modal-backdrop { position:absolute; inset:0; background:#05050AD9; backdrop-filter: blur(6px); display:flex; align-items:center; justify-content:center; z-index:10; padding:24px; }
  .center-modal-sheet { width:100%; max-width:380px; background:linear-gradient(165deg, var(--surface), var(--surface-alt)); border:1px solid var(--border-hi); border-radius:22px; padding:30px 28px 26px; box-shadow:0 40px 100px -20px #000000E0, 0 1px 0 #FFFFFF14 inset; animation: center-modal-in .28s cubic-bezier(.2,.9,.3,1.1); }
  @keyframes center-modal-in { from { opacity:0; transform:scale(.94) translateY(6px); } to { opacity:1; transform:scale(1) translateY(0); } }
  .detail-row { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); font-size:12.5px; }
  .detail-row:last-child { border-bottom:none; }
  .detail-row .k { color:var(--text-2); }
  .detail-row .v { font-family:var(--font-mono); color:var(--text); text-align:right; }

  .seal-dial { width:46px; height:46px; border-radius:50%; border:none; padding:2px; cursor:pointer; flex-shrink:0;
    background: conic-gradient(from 180deg, var(--jade), var(--violet), var(--azure), var(--jade), var(--violet), var(--jade));
    box-shadow: 0 0 0 1px var(--border); transition: box-shadow .4s ease; }
  .seal-dial.open { box-shadow: 0 0 0 1px var(--border-hi), 0 4px 18px -2px #6E9CF544; }
  .seal-inner { width:100%; height:100%; border-radius:50%; background:radial-gradient(circle at 38% 32%, var(--raised), var(--surface-alt));
    display:flex; align-items:center; justify-content:center; transition: transform .55s cubic-bezier(.2,.8,.2,1); }
  .seal-dial.open .seal-inner { transform: rotate(200deg); }
  .seal-inner .icwrap { transition: transform .55s cubic-bezier(.2,.8,.2,1); }
  .seal-dial.open .icwrap { transform: rotate(-200deg); }

  @media (prefers-reduced-motion: reduce) { .wv-btn, .wv-accent, .nav-indicator, .seal-inner, .icwrap { transition:none !important; } }

  /* ---------- Desktop layout: sidebar nav instead of the mobile bottom
     bar. The shell now genuinely uses the available screen width instead
     of sitting as a small fixed box in empty space; the card look
     (rounded corners, border, shadow) only applies at this breakpoint —
     mobile stays true edge-to-edge, no dead margins either. ---------- */
  @media (min-width: 860px) {
    body { padding: 40px 28px; }
    #root { max-width: 1400px; }
    .phone {
      display: grid;
      grid-template-columns: 260px 1fr;
      grid-template-rows: auto 1fr;
      grid-template-areas: "header header" "nav body";
      min-height: calc(100dvh - 80px);
      border-radius: 22px;
      border: 1px solid var(--border);
      box-shadow: 0 40px 90px -30px #000000BB, 0 1px 0 #FFFFFF0D inset;
    }
    .header { border-bottom: 1px solid var(--border); padding: 24px 28px; }
    .nav {
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      gap: 3px;
      border-top: none;
      border-right: 1px solid var(--border);
      padding: 18px 12px;
    }
    .nav-item { flex: none; flex-direction: row; justify-content: flex-start; gap: 11px; padding: 11px 14px; border-radius: 11px; }
    .nav-item span { font-size: 13px; }
    .nav-indicator { left: 8px; right: 8px; width: auto; top: var(--nav-top-px, 8px); bottom: auto; height: var(--nav-height-px, 44px); transition: top .38s cubic-bezier(.22,1,.36,1); }
    .body { padding: 30px 40px 40px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
    .body > * { width: 100%; max-width: 760px; flex-shrink: 0; }
    .auth-shell {
      grid-column: 1 / -1; grid-row: 1 / -1;
      display: grid; grid-template-columns: 1fr 1fr;
    }
    .auth-brand-panel {
      background:
        radial-gradient(130% 100% at 20% 0%, #241E42 0%, transparent 60%),
        radial-gradient(120% 100% at 90% 100%, #123D2E 0%, transparent 60%),
        var(--bg);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; justify-content: center;
      padding: 60px;
      position: relative; overflow: hidden;
    }
    .auth-brand-panel .brand-mark { width: 56px; height: 56px; border-radius: 16px; background: var(--aurora); display: flex; align-items: center; justify-content: center; box-shadow: 0 16px 36px -10px #6E9CF577; margin-bottom: 28px; }
    .auth-brand-panel .brand-mark span { font-family: var(--font-display); font-weight: 650; font-size: 24px; color: #0A0A12; }
    .auth-brand-panel h2 { font-family: var(--font-display); font-size: 34px; line-height: 1.2; margin: 0 0 14px; max-width: 380px; }
    .auth-brand-panel p { font-size: 14px; color: var(--text-2); line-height: 1.6; max-width: 360px; margin: 0; }
    .auth-form-panel { display: flex; align-items: center; justify-content: center; padding: 40px; }
    .auth-form-panel > div { width: 100%; max-width: 400px; min-height: auto !important; padding: 0 !important; }
  }
  @media (max-width: 859px) {
    .auth-brand-panel { display: none; }
  }
  @media (min-width: 1300px) {
    .body { padding: 34px 56px 48px; }
    .body > * { max-width: 860px; }
  }

</style>
</head>

<script>
(function () {
  const DB_KEY = "aster-vault-db";

  const ASSET_DEFS = [

  const SEED_WORD_POOL = [

    for (let i = 0; i < 9; i++) { v += (rand() - 0.48) * 13 + bias * 0.4; v = Math.max(12, Math.min(88, v)); pts.push(v); }
    const step = w / (pts.length - 1);
    const path = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${i * step} ${h - (p / 100) * h}`).join(" ");
    return { path, area: `${path} L ${w} ${h} L 0 ${h} Z` };
  }
  function sparkSvg(id, change) {
    const w = 60, h = 26;
    const { path, area } = sparkPath(id, change, w, h);
    const color = change > 0 ? "var(--jade)" : change < 0 ? "var(--negative)" : "var(--text-3)";
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="sg-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.35"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#sg-${id})" stroke="none"/><path d="${path}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }
  function qrSvg(seedText) {
    let s = (hashStr(seedText || "aster") % 90000) + 10000;
    const rand = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const grid = 12, cellPx = 12;
    let cells = "";
    for (let i = 0; i < grid * grid; i++) { const r = Math.floor(i / grid), c = i % grid; if (rand() > 0.55) cells += `<rect x="${c * cellPx}" y="${r * cellPx}" width="${cellPx - 1}" height="${cellPx - 1}" fill="#0A0A12"/>`; }
    const finder = (x, y) => `<rect x="${x}" y="${y}" width="${cellPx * 3.2}" height="${cellPx * 3.2}" fill="#0A0A12" rx="3"/><rect x="${x + cellPx * 0.5}" y="${y + cellPx * 0.5}" width="${cellPx * 2.2}" height="${cellPx * 2.2}" fill="#F4F1EA" rx="2"/><rect x="${x + cellPx * 1.1}" y="${y + cellPx * 1.1}" width="${cellPx * 1.0}" height="${cellPx * 1.0}" fill="#0A0A12"/>`;
    const total = grid * cellPx;
    return `<div style="background:#F4F1EA;border-radius:16px;padding:14px;box-shadow:0 20px 40px -16px #00000088;"><svg width="${total}" height="${total}" viewBox="0 0 ${total} ${total}">${cells}${finder(0, 0)}${finder(total - cellPx * 3.2, 0)}${finder(0, total - cellPx * 3.2)}</svg></div>`;
  }

    const cleanEmail = (email || "").trim();
    const id = toAccountId(cleanEmail);
    if (db.accounts[id]) {
      ui.error = "An account with this email already exists. Log in instead.";
      ui.authStep = "form"; ui.authMode = "login";

      return;

    const salt = randHex(16);
    const passwordHash = await hashPassword(password, salt);
    db.accounts[id] = {

      passwordHash,
      passwordSalt: salt,
      createdAt: Date.now(),

    const usedRefCode = (ui.authRefCode || "").trim().toUpperCase() || incomingRefCode;
    if (usedRefCode) {
      const referrer = Object.values(db.accounts).find((a) => a.referralCode === usedRefCode && a !== db.accounts[id]);

        referrer.referrals = referrer.referrals || [];

        db.accounts[id].referredBy = { name: referrer.name, code: usedRefCode };

    saveDB();

    if (!account) {

    if (!account.passwordHash) {

  /* ---------------- live crypto lines (real BTC 7-day data) ---------------- */
  async function ensureRealLineData() {
    if (realLinePoints || realLineLoading || realLineFailed) return;

    try {
      const res = await fetch("https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=7");
      if (!res.ok) throw new Error("request failed");
      const json = await res.json();
      const prices = (json.prices || []).map((p) => p[1]).filter((n) => typeof n === "number");
      if (prices.length < 16) throw new Error("not enough data");
      realLinePoints = prices;
    } catch (e) {
      realLineFailed = true;
    }
    realLineLoading = false;
    render();
  }

  function buildCandlesFromSeries(points, n, w, h) {
    const bucketSize = Math.max(1, Math.floor(points.length / n));
    const buckets = [];
    for (let i = 0; i < n; i++) {
      const slice = points.slice(i * bucketSize, i * bucketSize + bucketSize);
      if (slice.length === 0) continue;
      buckets.push({ open: slice[0], close: slice[slice.length - 1], high: Math.max(...slice), low: Math.min(...slice) });
    }
    const allVals = buckets.flatMap((b) => [b.open, b.close, b.high, b.low]);
    const min = Math.min(...allVals), max = Math.max(...allVals);
    const range = max - min || 1;
    const scaleY = (v) => h - ((v - min) / range) * h * 0.86 - h * 0.07;
    const barW = w / buckets.length;
    const TEAL = "#1FC9A3", RED = "#F0555A";
    let candles = "";
    buckets.forEach((b, i) => {
      const open = scaleY(b.open), close = scaleY(b.close), hi = scaleY(b.high), lo = scaleY(b.low);
      const up = close <= open;
      const color = up ? TEAL : RED;
      const x = i * barW;
      const cx = x + barW / 2;
      candles += `<line x1="${cx.toFixed(1)}" y1="${hi.toFixed(1)}" x2="${cx.toFixed(1)}" y2="${lo.toFixed(1)}" stroke="${color}" stroke-width="1"/>`;
      candles += `<rect x="${(x + barW * 0.16).toFixed(1)}" y="${Math.min(open, close).toFixed(1)}" width="${(barW * 0.68).toFixed(1)}" height="${Math.max(1.4, Math.abs(close - open)).toFixed(1)}" fill="${color}"/>`;
    });
    return candles;
  }

  function renderLiveLinesCard() {
    ensureRealLineData();
    const w = 640, h = 130, n = 50;
    let candles;
    if (realLinePoints) {
      candles = buildCandlesFromSeries(realLinePoints, n, w, h);
    } else {
      const rand = seededRandom(hashStr("aster-lines-placeholder"));
      const placeholder = [];
      let v = h * 0.6;
      for (let i = 0; i < 200; i++) { v += (rand() - 0.5) * h * 0.08; v = Math.max(h * 0.15, Math.min(h * 0.85, v)); placeholder.push(v); }
      candles = buildCandlesFromSeries(placeholder, n, w, h);
    }
    const tile = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${candles}</svg>`;
    return `

  // The desktop sidebar's nav column can be much taller than the four nav
  // buttons themselves (it stretches to match the dashboard content), so
  // we measure the active button's real pixel position instead of using
  // percentages. Because the whole markup is rebuilt on every render, the
  // indicator is a brand-new element each time — a plain CSS transition
  // has no "previous frame" to animate from and would just teleport (or
  // flash) into place. This does a manual FLIP: snap to the last known
  // position with transitions off, force a layout flush, then animate to
  // the new position on the next frame.
  let lastNavPos = null;
  function positionNavIndicator() {
    const indicator = root.querySelector(".nav-indicator");
    const activeItem = root.querySelector(".nav-item.active");
    if (!indicator || !activeItem) {
      lastNavPos = null;
      return;
    }
    const newTop = activeItem.offsetTop;
    const newHeight = activeItem.offsetHeight;
    if (lastNavPos) {
      indicator.style.transition = "none";
      indicator.style.setProperty("--nav-top-px", lastNavPos.top + "px");
      indicator.style.setProperty("--nav-height-px", lastNavPos.height + "px");
      indicator.getBoundingClientRect(); // flush layout so the jump-free start actually applies
      indicator.style.transition = "";
      requestAnimationFrame(() => {
        indicator.style.setProperty("--nav-top-px", newTop + "px");
        indicator.style.setProperty("--nav-height-px", newHeight + "px");
      });
    } else {
      indicator.style.setProperty("--nav-top-px", newTop + "px");
      indicator.style.setProperty("--nav-height-px", newHeight + "px");
    }
    lastNavPos = { top: newTop, height: newHeight };
  }

  function renderSend() {
    const assets = assetsList();
    const asset = assets.find((a) => a.id === ui.sendAssetId) || assets[0];
    const numAmount = parseFloat(ui.sendAmount) || 0;
    const insufficientFunds = numAmount > asset.amount;
    const canContinue = ui.sendAddress.trim().length > 6 && numAmount > 0 && !insufficientFunds;

    if (ui.sendStep === "done") {
      return `
        <div style="padding:44px 0; text-align:center;">
          <div style="width:58px;height:58px;border-radius:50%;background:#4FD1A515;border:1px solid #4FD1A544;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:0 0 0 8px #4FD1A50A;"><span style="color:var(--jade);">${ICONS.check}</span></div>
          <div style="font-family:var(--font-display); font-size:20px; margin-bottom:7px;">Transaction submitted</div>

        </div>`;

    if (ui.sendStep === "review") {

      return `

        <div class="card" style="padding:17px; margin-bottom:16px;">
          <div class="detail-row"><span class="k">Sending</span><span class="v">${fmtAmt(numAmount)} ${asset.symbol}</span></div>
          <div class="detail-row"><span class="k">To</span><span class="v">${truncate(ui.sendAddress)}</span></div>
          <div class="detail-row"><span class="k">Withdrawal fee (${(WITHDRAWAL_FEE_PCT * 100).toFixed(1)}%)</span><span class="v" style="color:var(--negative);">−${fmtAmt(feeAmount)} ${asset.symbol}</span></div>
          <div class="detail-row"><span class="k">Recipient receives</span><span class="v">${fmtAmt(recipientAmount)} ${asset.symbol}</span></div>
          <div class="detail-row" style="border-top:1px solid var(--border); margin-top:4px; padding-top:12px;"><span class="k">Total deducted from your balance</span><span class="v" style="font-size:15.5px; font-weight:600;">${fmtAmt(numAmount)} ${asset.symbol} (${fmtUSD(numAmount * asset.price)})</span></div>
        </div>
        <p style="font-size:11.5px; color:var(--text-3); line-height:1.55; margin-bottom:20px;">The withdrawal fee is deducted from the amount you're sending — nothing extra is required from your balance. Double-check the recipient address before confirming, transfers can't be reversed once sent.</p>

          <button class="wv-btn" data-act="send-step" data-step="form" style="flex:1; padding:12px 0; border-radius:10px; border:1px solid var(--border); background:transparent; color:var(--text); font-size:13.5px;">Edit</button>
          <button class="wv-btn wv-accent" data-act="send-confirm" style="flex:1; padding:12px 0; border-radius:10px; border:none; background:var(--aurora); color:#0A0A12; font-size:13.5px; font-weight:600; box-shadow:0 12px 26px -12px #6E9CF599;">Confirm &amp; send</button>
        </div>`;
    }

    return `
      <div class="back-header"><button class="back-btn wv-btn" data-act="tab" data-tab="dashboard">${ICONS.chevLeft}</button><span class="back-title">Send</span></div>
      <label class="field-label">Asset</label>
      <div class="chip-row">
        ${assets.map((a) => `<button class="chip wv-btn ${a.id === ui.sendAssetId ? "active" : ""}" data-act="send-asset" data-id="${a.id}">${coinSvg(a.id, 22)}<span>${a.symbol}</span></button>`).join("")}

      <div style="display:flex; align-items:center; justify-content:space-between; margin:18px 0 7px;">
        <label class="field-label" style="margin:0;">Amount</label>
        <span style="font-size:11px; color:var(--text-3); font-family:var(--font-mono);">Available: ${fmtAmt(asset.amount)} ${asset.symbol}</span>

      ${asset.amount === 0 && !insufficientFunds ? `<div style="font-size:11.5px; color:var(--text-3); margin-top:7px;">Your ${asset.symbol} balance is empty. Receive funds first.</div>` : ""}

        <div style="position:relative; display:flex; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:4px; margin-bottom:24px;">
          <div style="position:absolute; top:4px; bottom:4px; left:${ui.authMode === "login" ? "4px" : "50%"}; width:calc(50% - 4px); border-radius:10px; background:linear-gradient(160deg, #6E9CF524, #4FD1A518); border:1px solid #6E9CF53A; transition:left .32s cubic-bezier(.22,1,.36,1);"></div>
          ${["login", "register"].map((m) => `<button class="wv-btn" data-act="auth-mode" data-mode="${m}" style="flex:1; position:relative; z-index:1; background:none; border:none; padding:9px 0; font-size:13px; font-weight:600; color:${ui.authMode === m ? "var(--text)" : "var(--text-3)"};">${m === "login" ? "Log in" : "Create account"}</button>`).join("")}
        </div>
        <div style="display:flex; flex-direction:column; gap:14px;">
          ${ui.authMode === "register" ? `<div><label class="field-label">Full name</label><input id="auth-name" class="field-input" placeholder="Jordan Reyes" value="${ui.authName.replace(/"/g, "&quot;")}" /></div>` : ""}
          <div><label class="field-label">Email</label><input id="auth-email" class="field-input" type="email" placeholder="you@example.com" value="${ui.authEmail.replace(/"/g, "&quot;")}" /></div>
          <div><label class="field-label">Password</label><div style="position:relative;"><input id="auth-password" class="field-input" style="padding-right:42px;" type="${ui.showPass ? "text" : "password"}" placeholder="••••••••" value="${ui.authPassword.replace(/"/g, "&quot;")}" /><button class="wv-btn" data-act="toggle-pass" style="position:absolute; right:6px; top:6px; background:none; border:none; color:var(--text-3); padding:6px;">${ui.showPass ? ICONS.eyeOff : ICONS.eye}</button></div></div>
          ${ui.authMode === "register" ? `<div><label class="field-label">Confirm password</label><input id="auth-confirm" class="field-input" type="${ui.showPass ? "text" : "password"}" placeholder="••••••••" value="${ui.authConfirm.replace(/"/g, "&quot;")}" /></div>` : ""}
          ${ui.authMode === "register" ? `<div><label class="field-label">Referral code <span style="color:var(--text-3); font-weight:400;">(optional)</span></label><input id="auth-refcode" class="field-input" style="text-transform:uppercase; letter-spacing:1px;" placeholder="e.g. AB12CD3" value="${ui.authRefCode.replace(/"/g, "&quot;")}" /></div>` : ""}
        </div>
        ${ui.error ? `<div style="font-size:12px; color:var(--negative); margin-top:12px;">${ui.error}</div>` : ""}
        <button class="wv-btn wv-accent" data-act="auth-submit" style="width:100%; margin-top:22px; padding:14px 0; border-radius:12px; border:none; background:var(--aurora); color:#0A0A12; font-size:14px; font-weight:600; box-shadow:0 14px 30px -12px #6E9CF599;">${ui.authMode === "login" ? "Log in" : "Continue"}</button>
        <div style="display:flex; align-items:center; justify-content:center; gap:6px; margin-top:auto; padding-top:26px;"><span style="color:var(--text-3);">${ICONS.key}</span><span style="font-size:11px; color:var(--text-3); text-align:center;">Secured end to end.</span></div>
      </div>`;
  }

  /* ---------------- events ---------------- */
  function wire() {
    root.querySelectorAll("[data-act]").forEach((el) => {
      el.addEventListener("click", (e) => {
        const act = el.dataset.act;
        if (act === "tab") { ui.tab = el.dataset.tab; if (el.dataset.tab === "send") { ui.sendStep = "form"; } render(); }
        else if (act === "toggle-balance") { ui.balanceVisible = !ui.balanceVisible; render(); }
        else if (act === "streak-checkin") {
          const a = acc(); if (!a) return;
          a.lastStreakAt = Date.now();
          saveDB();
          render();
        }
        else if (act === "open-tx") { ui.txDetailId = el.dataset.id; render(); }
        else if (act === "close-tx") { ui.txDetailId = null; render(); }
        else if (act === "send-asset") { ui.sendAssetId = el.dataset.id; render(); }
        else if (act === "send-max") { const a = assetsList().find((x) => x.id === ui.sendAssetId); ui.sendAmount = String(a.amount); render(); }
        else if (act === "send-continue") {
          const a = assetsList().find((x) => x.id === ui.sendAssetId);
          const n = parseFloat(ui.sendAmount) || 0;
          if (ui.sendAddress.trim().length > 6 && n > 0 && n <= a.amount) {
            if (!sendEligibility(acc()).eligible) { ui.sendBlocked = true; }
            else { ui.sendStep = "review"; }
            render();
          }
        }
        else if (act === "close-send-blocked") { ui.sendBlocked = false; render(); }
        else if (act === "send-step") { ui.sendStep = el.dataset.step; render(); }
        else if (act === "send-confirm") { const n = parseFloat(ui.sendAmount) || 0; sendFunds(ui.sendAssetId, n, ui.sendAddress); ui.sendStep = "done"; render(); }
        else if (act === "send-done") { ui.sendStep = "form"; ui.sendAddress = ""; ui.sendAmount = ""; ui.tab = "dashboard"; render(); }
        else if (act === "receive-asset") { ui.receiveAssetId = el.dataset.id; render(); }
        else if (act === "copy-address") { const addr = acc()?.addresses?.[ui.receiveAssetId] || ""; navigator.clipboard?.writeText(addr).catch(() => {}); ui.receiveCopied = true; render(); showToast("Address copied"); setTimeout(() => { ui.receiveCopied = false; }, 1600); }
        else if (act === "copy-ref-code") { navigator.clipboard?.writeText(acc()?.referralCode || "").catch(() => {}); ui.refCodeCopied = true; render(); showToast("Code copied"); setTimeout(() => { ui.refCodeCopied = false; }, 1600); }
        else if (act === "copy-ref-link") { const link = `${window.location.origin}${window.location.pathname}?ref=${acc()?.referralCode || ""}`; navigator.clipboard?.writeText(link).catch(() => {}); ui.refLinkCopied = true; render(); showToast("Link copied"); setTimeout(() => { ui.refLinkCopied = false; }, 1600); }
        else if (act === "activity-filter") { ui.activityFilter = el.dataset.id; render(); }
        else if (act === "sign-out") { session = null; ui.tab = "dashboard"; render(); }
        else if (act === "auth-mode") { ui.authMode = el.dataset.mode; ui.authStep = "form"; ui.error = ""; render(); }
        else if (act === "toggle-pass") { ui.showPass = !ui.showPass; render(); }
        else if (act === "auth-submit") { submitAuth(); }
        else if (act === "reveal-seed") { ui.seedRevealed = true; render(); }
        else if (act === "copy-seed") { navigator.clipboard?.writeText(ui.seedPhraseWords.join(" ")).catch(() => {}); ui.copied = true; render(); setTimeout(() => { ui.copied = false; }, 1600); }
        else if (act === "toggle-seed-saved") { ui.seedSaved = !ui.seedSaved; render(); }
        else if (act === "enter-vault") { registerAndSignIn(ui.authEmail, ui.authName, ui.authPassword); }
      });
    });

    const liveBind = (id, setter) => { const el = document.getElementById(id); if (el) el.addEventListener("input", () => setter(el.value)); };
    liveBind("auth-name", (v) => (ui.authName = v));
    liveBind("auth-email", (v) => (ui.authEmail = v));
    liveBind("auth-password", (v) => (ui.authPassword = v));
    liveBind("auth-confirm", (v) => (ui.authConfirm = v));
    liveBind("auth-refcode", (v) => (ui.authRefCode = v.toUpperCase()));
    liveBind("send-address", (v) => (ui.sendAddress = v));
    liveBind("send-amount", (v) => (ui.sendAmount = v.replace(/[^0-9.]/g, "")));
  }

  function submitAuth() {
    const email = ui.authEmail;
    const password = ui.authPassword;
    if (ui.authMode === "login") {
      if (email.trim().length <= 3 || password.length < 4) { ui.error = "Enter a valid email and a password of at least 4 characters."; render(); return; }
      ui.error = "";
      loginWithPassword(email, password);
    } else {
      const name = ui.authName;
      const confirm = ui.authConfirm;
      if (name.trim().length <= 1 || email.trim().length <= 3 || password.length < 6 || password !== confirm) {
        ui.error = password !== confirm ? "Passwords don't match." : "Fill in every field — password needs 6+ characters.";
        render(); return;
      }
      if (db.accounts[toAccountId(email)]) {
        ui.error = "An account with this email already exists. Log in instead.";
        render(); return;
      }
      ui.error = "";
      ui.seedPhraseWords = generateSeedPhrase();
      ui.authStep = "seed"; render();
    }
  }

  /* ---------------- boot + cross-device sync ----------------
     Loads the real account data from the server on startup, then polls
     periodically so changes made in admin.html (on this device or any
     other) show up here too. Skips re-rendering while you're actively
     typing so nothing gets wiped mid-keystroke. ---------------- */
  async function boot() {
    const loaded = await loadDB();
    if (loaded) db = loaded;
    dbReady = true;
    render();
    setInterval(async () => {
      const fresh = await loadDB();
      if (!fresh) return;
      db = fresh;
      if (session && !db.accounts[session.id]) session = null;
      const typing = document.activeElement && ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName);
      if (session && !typing) render();
    }, 3000);
    // Live-tick the streak countdown — only re-renders while it's actually
    // visible (dashboard tab, cooldown active) so it never interrupts
    // typing or animations anywhere else in the app.
    setInterval(() => {
      if (session && ui.tab === "dashboard" && streakStatus(acc()).onCooldown) render();
    }, 1000);
  }

  render(); // initial paint with placeholder data while the real data loads
  boot();
})();
</script>
</body>
</html>
