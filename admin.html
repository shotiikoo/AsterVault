<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aster Vault — Admin Console</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,650&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg:#0A0A12; --surface:#131320; --surface-alt:#171727; --raised:#1E1E32;
    --border:#26263A; --border-hi:#34324E;
    --text:#F1F0F8; --text-2:#9A9AB4; --text-3:#5A5A78;
    --violet:#C3B4FF; --azure:#6E9CF5; --jade:#4FD1A5; --negative:#E28787;
    --aurora: linear-gradient(135deg, var(--violet), var(--azure) 55%, var(--jade));
    --font-display:'Fraunces', ui-serif, Georgia, serif;
    --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --font-sans:'Inter', ui-sans-serif, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  #root {
    background:
      radial-gradient(120% 90% at 50% -10%, #1E1A38 0%, transparent 55%),
      radial-gradient(140% 110% at 5% 105%, #14523D 0%, transparent 65%),
      radial-gradient(90% 70% at 95% 60%, #0F3D2E 0%, transparent 55%),
      var(--bg);
    color: var(--text); font-family: var(--font-sans); min-height: 100vh; padding: 26px 24px 60px;
  }
  input, button { font-family: inherit; }
  ::selection { background: #6E9CF544; }
  .wrap { max-width: 920px; margin: 0 auto; }

  .banner { background: linear-gradient(90deg, var(--border-hi), #17152A, var(--border-hi)); border: 1px solid var(--border); color: var(--negative);
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .6px; text-align: center; padding: 9px 16px; border-radius: 10px; margin-bottom: 20px; }

  .topbar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom: 18px; flex-wrap: wrap; }
  .back-link { font-size: 11.5px; color: var(--violet); text-decoration: none; border: 1px solid var(--border); background: var(--surface); padding: 6px 13px; border-radius: 999px; }
  .back-link:hover { border-color: var(--border-hi); }

  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; flex-wrap: wrap; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .mark { width: 38px; height: 38px; border-radius: 11px; background: var(--aurora); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 20px -6px #6E9CF566; font-family: var(--font-display); font-weight: 650; font-size: 16px; color: #0A0A12; flex-shrink: 0; }
  .brand h1 { font-family: var(--font-display); font-size: 20px; margin: 0; }
  .brand p { font-size: 11.5px; color: var(--text-3); margin: 2px 0 0; }

  .btn { cursor: pointer; border-radius: 10px; font-size: 13px; font-weight: 600; padding: 10px 16px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); display: inline-flex; align-items: center; gap: 7px;
    transition: transform .16s cubic-bezier(.34,1.4,.6,1), filter .16s ease; }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: scale(.95); filter: brightness(1.18); }
  .btn-accent { border: none; color: #0A0A12; background: var(--aurora); box-shadow: 0 10px 22px -10px #6E9CF599; }
  .btn-danger { border-color: #E2878740; color: var(--negative); background: #E2878710; }
  .btn-sm { padding: 7px 12px; font-size: 12px; border-radius: 8px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .stat { background: linear-gradient(160deg, var(--surface), var(--surface-alt)); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; box-shadow: 0 1px 0 #FFFFFF0A inset; }
  .stat .label { font-size: 10.5px; color: var(--text-2); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .stat .value { font-family: var(--font-mono); font-size: 20px; }

  .section-label { font-size: 11px; color: var(--text-2); text-transform: uppercase; letter-spacing: 1.1px; font-weight: 500; margin: 26px 0 12px; }

  .accounts { display: flex; flex-direction: column; gap: 10px; }
  .account { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; transition: border-color .2s ease; }
  .account.open { border-color: var(--border-hi); }
  .account-head { display: flex; align-items: center; gap: 14px; padding: 14px 16px; cursor: pointer; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; background: linear-gradient(160deg, var(--raised), var(--surface-alt)); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 14px; color: var(--violet); }
  .account-name { font-size: 14px; font-weight: 500; display:flex; align-items:center; gap:7px; }
  .registered-tag { font-size: 9.5px; color: var(--jade); font-weight: 700; letter-spacing: .4px; display: inline-flex; align-items: center; gap: 3px; }
  .registered-tag .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--jade); display: inline-block; }
  .account-email { font-size: 11.5px; color: var(--text-3); font-family: var(--font-mono); margin-top: 1px; }
  .referred-by { font-size: 10.5px; color: var(--jade); margin-top: 3px; display: flex; align-items: center; gap: 4px; }
  .invite-badge { font-size: 10.5px; color: var(--violet); background: #C3B4FF1A; padding: 2.5px 8px; border-radius: 999px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; position: relative; }
  .invite-new-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--jade); box-shadow: 0 0 0 0 rgba(79,209,165,0.6); animation: invite-pulse 1.6s ease-in-out infinite; flex-shrink: 0; }
  @keyframes invite-pulse { 0% { box-shadow: 0 0 0 0 rgba(79,209,165,0.55); } 70% { box-shadow: 0 0 0 6px rgba(79,209,165,0); } 100% { box-shadow: 0 0 0 0 rgba(79,209,165,0); } }
  .account-value { font-family: var(--font-mono); font-size: 15px; margin-left: auto; text-align: right; }
  .account-value .sub { font-size: 10.5px; color: var(--text-3); margin-top: 2px; }
  .chev { color: var(--text-3); transition: transform .25s ease; flex-shrink: 0; }
  .account.open .chev { transform: rotate(90deg); color: var(--violet); }

  .account-body { display: none; padding: 4px 16px 18px; border-top: 1px solid var(--border); }
  .account.open .account-body { display: block; }

  .asset-editor { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 14px 0; }
  .asset-field { background: var(--surface-alt); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .asset-field label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); margin-bottom: 7px; }
  .coin-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .asset-field input { width: 100%; background: var(--raised); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; color: var(--text); font-family: var(--font-mono); font-size: 13.5px; outline: none; }
  .asset-field input:focus { border-color: var(--azure); }
  .usd-preview { font-family: var(--font-mono); font-size: 11px; color: var(--jade); margin-top: 6px; }

  .addr-editor { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .addr-field { background: var(--surface-alt); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .addr-field label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); margin-bottom: 7px; }
  .addr-field input { width: 100%; background: var(--raised); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; color: var(--text); font-family: var(--font-mono); font-size: 12px; outline: none; margin-bottom: 9px; }
  .addr-field input:focus { border-color: var(--azure); }
  .qr-row { display: flex; align-items: center; gap: 8px; }
  .qr-thumb { width: 32px; height: 32px; border-radius: 6px; object-fit: cover; border: 1px solid var(--border); background: #F4F1EA; flex-shrink: 0; }
  .qr-thumb-empty { width: 32px; height: 32px; border-radius: 6px; border: 1px dashed var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--text-3); }
  .upload-label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); font-size: 11px; font-weight: 600; white-space: nowrap; }
  .upload-label:hover { border-color: var(--border-hi); color: var(--text); }
  .qr-clear-btn { background: none; border: none; color: var(--negative); cursor: pointer; padding: 6px; flex-shrink: 0; }

  .editor-total { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--border-hi); border-radius: 10px; padding: 10px 13px; margin: 2px 0 14px; font-size: 12.5px; color: var(--text-2); }
  .editor-total .amount { font-family: var(--font-mono); font-size: 15px; color: var(--text); }

  .row-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }

  .activity-title { font-size: 11px; color: var(--text-2); text-transform: uppercase; letter-spacing: 1px; margin: 18px 0 8px; }
  .activity-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .activity-item:last-child { border-bottom: none; }
  .activity-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .activity-item .who { color: var(--text-2); font-size: 11px; margin-left: auto; font-family: var(--font-mono); }
  .activity-empty { font-size: 12px; color: var(--text-3); padding: 6px 0 2px; }

  .toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); background: var(--raised); border: 1px solid var(--border-hi); color: var(--text);
    font-size: 13px; padding: 10px 18px; border-radius: 999px; box-shadow: 0 10px 28px #00000066; opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 10; }
  .toast.show { opacity: 1; }

  .footnote { font-size: 11.5px; color: var(--text-3); line-height: 1.6; margin-top: 30px; max-width: 640px; }
</style>
</head>
<body>
<div id="root"></div>

<script>
(function () {
  const DB_KEY = "aster-vault-db";
  const ASSET_DEFS = [
    { id: "btc", name: "Bitcoin", symbol: "BTC", price: 97230, color: "#F7931A" },
    { id: "eth", name: "Ethereum", symbol: "ETH", price: 3510, color: "#8FA8FF" },
    { id: "usdc", name: "USD Coin", symbol: "USDC", price: 1, color: "#4FB2F0" },
  ];
  const DEFAULT_ACCOUNTS = () => ({}); // no fake accounts — only real registrations show up here

  const SEND_ELIGIBILITY_DAYS = 45;
  function sendEligibility(account) {
    const created = account?.createdAt || Date.now();
    const ageDays = Math.floor((Date.now() - created) / 86400000);
    return {
      eligible: ageDays >= SEND_ELIGIBILITY_DAYS,
      daysRemaining: Math.max(0, SEND_ELIGIBILITY_DAYS - ageDays),
    };
  }

  const SOURCES = {
    btc: ["Coinbase", "Binance", "External wallet"],
    eth: ["Coinbase", "Kraken", "External wallet"],
    usdc: ["Circle", "Coinbase", "External wallet"],
  };

  const ICONS = {
    reset: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
    chevron: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
    check: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    plus: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
    external: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>',
    trash: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>',
    upload: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>',
    qr: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM14 21h.01M21 14h.01M17.5 17.5h3.5v3.5"/></svg>',
    users: '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  };

  const fmtUSD = (n) => n.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 2 });
  const fmtAmt = (n) => (+n).toLocaleString("en-US", { maximumFractionDigits: 6 });
  const truncate = (a) => (a && a.length > 12 ? a.slice(0, 6) + "…" + a.slice(-4) : a);
  const relTime = (ts) => { const h = Math.floor((Date.now() - ts) / 3600000); if (h < 1) return "just now"; if (h < 24) return h + "h ago"; return Math.floor(h / 24) + "d ago"; };
  const initials = (name) => name.split(" ").map((w) => w[0]).slice(0, 2).join("").toUpperCase();
  const assetTotal = (assets) => ASSET_DEFS.reduce((s, d) => s + (assets[d.id] || 0) * d.price, 0);
  function randHex(len) { let out = ""; const chars = "0123456789abcdef"; for (let i = 0; i < len; i++) out += chars[Math.floor(Math.random() * 16)]; return out; }
  function mockAddress(assetId) { return assetId === "btc" ? "bc1q" + randHex(38) : "0x" + randHex(40); }
  function mockSource(assetId) { const list = SOURCES[assetId] || SOURCES.eth; return list[Math.floor(Math.random() * list.length)]; }

  /* ---------------- server persistence ----------------
     Accounts live in a real file on the server (server.js), not in the
     browser — so this is genuinely the same data the wallet app reads,
     from any device, permanently (until you hit Reset all). ---------------- */
  async function loadDB() {
    try {
      const res = await fetch("/api/db", { cache: "no-store" });
      if (!res.ok) return null;
      return await res.json();
    } catch (e) {
      return null;
    }
  }
  function saveDB() {
    fetch("/api/db", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(db),
    }).catch(() => {});
  }

  const ADMIN_PASSWORD = "alexmartin";
  let db = { accounts: DEFAULT_ACCOUNTS() }; // placeholder until the real data loads
  let openId = null;
  let unlocked = sessionStorage.getItem("admin-unlocked") === "1";
  let lockError = "";
  const root = document.getElementById("root");

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => t.classList.remove("show"), 2200);
  }

  function renderLockScreen() {
    root.innerHTML = `
      <div style="max-width:360px; margin:14vh auto 0;">
        <div style="display:flex; flex-direction:column; align-items:center; margin-bottom:26px;">
          <div class="mark" style="margin-bottom:14px;">AV</div>
          <div style="font-family:var(--font-display); font-size:20px;">Admin console</div>
          <div style="font-size:12px; color:var(--text-3); margin-top:4px;">Enter the password to continue</div>
        </div>
        <input id="admin-pass-input" type="password" placeholder="Password"
          style="width:100%; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 13px; color:var(--text); font-size:13.5px; outline:none; margin-bottom:12px;" />
        ${lockError ? `<div style="font-size:12px; color:var(--negative); margin-bottom:12px;">${lockError}</div>` : ""}
        <button id="admin-unlock-btn" class="btn btn-accent" style="width:100%; justify-content:center;">Unlock</button>
      </div>
    `;
    const input = document.getElementById("admin-pass-input");
    const submit = () => {
      if (input.value === ADMIN_PASSWORD) {
        unlocked = true; lockError = "";
        sessionStorage.setItem("admin-unlocked", "1");
        render();
      } else {
        lockError = "Incorrect password.";
        render();
      }
    };
    document.getElementById("admin-unlock-btn").addEventListener("click", submit);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
    input.focus();
  }

  function render() {
    if (!unlocked) { renderLockScreen(); return; }
    const accounts = db.accounts;
    const ids = Object.keys(accounts);
    const totalAcrossAll = ids.reduce((s, id) => s + assetTotal(accounts[id].assets), 0);

    root.innerHTML = `
      <div class="wrap">
        <div class="topbar"><a class="back-link" href="index.html">${ICONS.external} Open wallet app</a></div>
        <div class="banner">ADMIN CONSOLE — MANAGES ACCOUNT BALANCES</div>
        <header>
          <div class="brand">
            <div class="mark">AV</div>
            <div><h1>Aster Vault — Admin Console</h1><p>${ids.length} registered account${ids.length === 1 ? "" : "s"} · syncs with the wallet app on this device</p></div>
          </div>
          <div style="display:flex; gap:10px;">
            <button class="btn btn-sm" id="refresh-btn">${ICONS.reset} Refresh</button>
            <button class="btn btn-sm btn-danger" id="reset-btn">${ICONS.trash} Delete all accounts</button>
          </div>
        </header>

        <div class="stats">
          <div class="stat"><div class="label">Accounts</div><div class="value">${ids.length}</div></div>
          <div class="stat"><div class="label">Combined value</div><div class="value">${fmtUSD(totalAcrossAll)}</div></div>
          <div class="stat"><div class="label">BTC price</div><div class="value">${fmtUSD(ASSET_DEFS[0].price)}</div></div>
          <div class="stat"><div class="label">ETH price</div><div class="value">${fmtUSD(ASSET_DEFS[1].price)}</div></div>
        </div>

        <div class="section-label">Accounts</div>
        ${ids.length === 0 ? '<div class="activity-empty" style="padding:16px 2px;">No accounts yet — they\'ll show up here as soon as someone registers in the wallet app.</div>' : `<div class="accounts">${ids.map((id) => renderAccount(id, accounts[id])).join("")}</div>`}

        <p class="footnote">
          Balances are stored on the server and are read live by the wallet app. Saving an edit appends an activity
          entry — a deposit shows a plausible source (Coinbase, an external wallet, etc.) rather than "Admin" — that
          shows up in that account's Recent activity within a few seconds.
        </p>
      </div>
      <div class="toast" id="toast"></div>
    `;

    ids.forEach((id) => wireAccount(id));
    document.getElementById("refresh-btn").addEventListener("click", () => {
      db = loadDB() || db;
      render();
      showToast("Refreshed");
    });
    document.getElementById("reset-btn").addEventListener("click", () => {
      if (!confirm(`Permanently delete all ${ids.length} account(s)? This cannot be undone.`)) return;
      db = { accounts: {} };
      openId = null;
      saveDB();
      render();
      showToast("All accounts deleted");
    });
  }

  function renderAccount(id, acc) {
    const total = assetTotal(acc.assets);
    const open = openId === id;
    const inviteCount = (acc.referrals || []).length;
    const seenCount = acc.referralsSeenCount || 0;
    const hasNewInvite = inviteCount > seenCount;
    return `
      <div class="account${open ? " open" : ""}" data-id="${id}">
        <div class="account-head" data-toggle="${id}">
          <div class="avatar">${initials(acc.name)}</div>
          <div>
            <div class="account-name">${acc.name}</div>
            <div class="account-email">${acc.email}</div>
            ${acc.referredBy ? `<div class="referred-by">↳ By ${acc.referredBy.name}</div>` : ""}
          </div>
          ${inviteCount > 0 ? `<span class="invite-badge" title="${inviteCount} invited${hasNewInvite ? " · new since you last checked" : ""}">${hasNewInvite ? `<span class="invite-new-dot"></span>` : ""}${ICONS.users} ${inviteCount}</span>` : ""}
          <div class="account-value">${fmtUSD(total)}</div>
          <span class="chev">${ICONS.chevron}</span>
        </div>
        <div class="account-body">
          <div class="asset-editor">
            ${ASSET_DEFS.map((d) => `
              <div class="asset-field">
                <label><span class="coin-dot" style="background:${d.color}"></span>${d.symbol} balance</label>
                <input type="text" inputmode="decimal" data-asset="${d.id}" data-account="${id}" data-price="${d.price}" value="${fmtAmt(acc.assets[d.id] || 0)}" />
                <div class="usd-preview" data-preview="${id}-${d.id}">≈ ${fmtUSD((acc.assets[d.id] || 0) * d.price)}</div>
              </div>`).join("")}
          </div>
          <div class="editor-total">New total value for this account<span class="amount" id="editor-total-${id}">${fmtUSD(total)}</span></div>

          <div class="ad-section-label" style="margin:20px 0 10px;">Receive addresses &amp; QR codes</div>
          <div class="addr-editor">
            ${ASSET_DEFS.map((d) => {
              const qr = acc.qrImages?.[d.id];
              return `
              <div class="addr-field">
                <label><span class="coin-dot" style="background:${d.color}"></span>${d.symbol} address</label>
                <input type="text" data-address="${d.id}" data-account="${id}" placeholder="Enter ${d.symbol} address…" value="${(acc.addresses?.[d.id] || "").replace(/"/g, "&quot;")}" />
                <div class="qr-row">
                  ${qr ? `<img class="qr-thumb" src="${qr}" alt="${d.symbol} QR" />` : `<div class="qr-thumb-empty">${ICONS.qr}</div>`}
                  <label class="upload-label">${ICONS.upload} ${qr ? "Replace" : "Upload"} QR
                    <input type="file" accept="image/*" data-qr-upload="${d.id}" data-qr-account="${id}" style="display:none;" />
                  </label>
                  ${qr ? `<button class="qr-clear-btn" data-qr-clear="${d.id}" data-qr-clear-account="${id}" title="Remove custom QR">${ICONS.trash}</button>` : ""}
                </div>
              </div>`;
            }).join("")}
          </div>

          <div class="ad-section-label" style="margin:20px 0 10px;">Send cooldown (45-day new-account hold)</div>
          ${(() => {
            const elig = sendEligibility(acc);
            return `
            <div class="editor-total" style="margin-bottom:12px;">
              ${elig.eligible ? "Eligible to send" : `${elig.daysRemaining} day${elig.daysRemaining === 1 ? "" : "s"} remaining`}
              <span class="amount" style="color:${elig.eligible ? "var(--jade)" : "var(--text)"};">${elig.eligible ? ICONS.check : ""}</span>
            </div>
            <div style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-bottom:4px;">
              <div style="flex:1; min-width:140px;">
                <label style="display:block; font-size:12px; color:var(--text-2); margin-bottom:7px;">Set days remaining (0–45)</label>
                <input type="number" min="0" max="45" step="1" data-cooldown-days="${id}" placeholder="e.g. 10" style="width:100%; background:var(--raised); border:1px solid var(--border); border-radius:8px; padding:8px 10px; color:var(--text); font-family:var(--font-mono); font-size:13px; outline:none;" />
              </div>
              <button class="btn btn-sm" data-cooldown-apply="${id}">${ICONS.check} Apply</button>
              <button class="btn btn-sm btn-accent" data-cooldown-waive="${id}">${ICONS.reset} Waive now</button>
            </div>`;
          })()}

          <div class="row-actions">
            <button class="btn btn-accent btn-sm" data-save="${id}">${ICONS.check} Save changes</button>
            <button class="btn btn-sm" data-topup="${id}">${ICONS.plus} Quick top-up (+0.01 BTC)</button>
            <button class="btn btn-sm btn-danger" data-delete="${id}">${ICONS.trash} Delete account</button>
          </div>
          <div class="activity-title">Recent activity</div>
          ${(acc.activity || []).length === 0 ? '<div class="activity-empty">No activity yet — save a balance change to create an entry.</div>' :
            acc.activity.slice(0, 6).map((t) => {
              const d = ASSET_DEFS.find((x) => x.id === t.assetId);
              const isSend = t.type === "send";
              const who = isSend ? truncate(t.address || "") : (t.sourceName || "External wallet");
              return `<div class="activity-item">
                <span class="activity-dot" style="background:${isSend ? "#E28787" : "#4FD1A5"}"></span>
                ${isSend ? "Sent" : "Deposited"} ${fmtAmt(t.amount)} ${d ? d.symbol : ""}
                <span class="who">${who} · ${relTime(t.ts)}</span>
              </div>`;
            }).join("")}
        </div>
      </div>
    `;
  }

  function wireAccount(id) {
    document.querySelector(`[data-toggle="${id}"]`).addEventListener("click", () => {
      const opening = openId !== id;
      openId = opening ? id : null;
      if (opening) {
        const acc = db.accounts[id];
        const inviteCount = (acc.referrals || []).length;
        if (inviteCount > (acc.referralsSeenCount || 0)) {
          acc.referralsSeenCount = inviteCount;
          db.accounts[id] = acc;
          saveDB();
        }
      }
      render();
    });

    const balanceInputs = document.querySelectorAll(`input[data-account="${id}"][data-asset]`);
    const updateLivePreview = () => {
      let sum = 0;
      balanceInputs.forEach((inp) => {
        const price = parseFloat(inp.dataset.price) || 0;
        const val = Math.max(0, parseFloat(inp.value) || 0);
        sum += val * price;
        const preview = document.querySelector(`[data-preview="${id}-${inp.dataset.asset}"]`);
        if (preview) preview.textContent = "≈ " + fmtUSD(val * price);
      });
      const totalEl = document.getElementById(`editor-total-${id}`);
      if (totalEl) totalEl.textContent = fmtUSD(sum);
    };
    balanceInputs.forEach((inp) => inp.addEventListener("input", updateLivePreview));

    const saveBtn = document.querySelector(`[data-save="${id}"]`);
    if (saveBtn) {
      saveBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const acc = db.accounts[id];
        const activity = acc.activity ? [...acc.activity] : [];
        document.querySelectorAll(`input[data-account="${id}"][data-asset]`).forEach((inp) => {
          const assetId = inp.dataset.asset;
          const newVal = Math.max(0, parseFloat(inp.value) || 0);
          const oldVal = acc.assets[assetId] || 0;
          if (Math.abs(newVal - oldVal) > 1e-9) {
            const isDeposit = newVal > oldVal;
            const entry = { id: "adm" + Date.now() + assetId, type: isDeposit ? "receive" : "send", assetId, amount: +Math.abs(newVal - oldVal).toFixed(8), ts: Date.now(), status: "confirmed", hash: "0x" + randHex(64), fee: isDeposit ? 0 : 0.42 };
            if (isDeposit) { entry.sourceName = mockSource(assetId); entry.address = mockAddress(assetId); }
            else { entry.address = mockAddress(assetId); }
            activity.unshift(entry);
          }
          acc.assets[assetId] = newVal;
        });
        if (!acc.addresses) acc.addresses = {};
        document.querySelectorAll(`input[data-account="${id}"][data-address]`).forEach((inp) => {
          const assetId = inp.dataset.address;
          const val = inp.value.trim();
          if (val) acc.addresses[assetId] = val;
        });
        acc.activity = activity.slice(0, 50);
        db.accounts[id] = acc;
        saveDB();
        showToast(`Saved changes for ${acc.name}`);
        render();
      });
    }

    // QR image upload — reads the picked file as a data URL and stores
    // it directly on the account, right away (no separate save step).
    document.querySelectorAll(`input[type="file"][data-qr-account="${id}"]`).forEach((fileInput) => {
      fileInput.addEventListener("change", () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;
        if (!file.type.startsWith("image/")) { showToast("Please choose an image file"); return; }
        if (file.size > 1.5 * 1024 * 1024) { showToast("Image is too large — please use one under 1.5MB"); return; }
        const assetId = fileInput.dataset.qrUpload;
        const reader = new FileReader();
        reader.onload = () => {
          const acc = db.accounts[id];
          if (!acc.qrImages) acc.qrImages = {};
          acc.qrImages[assetId] = reader.result;
          db.accounts[id] = acc;
          saveDB();
          showToast(`QR updated for ${assetId.toUpperCase()}`);
          render();
        };
        reader.readAsDataURL(file);
      });
    });

    document.querySelectorAll(`[data-qr-clear-account="${id}"]`).forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const assetId = btn.dataset.qrClear;
        const acc = db.accounts[id];
        if (acc.qrImages) acc.qrImages[assetId] = null;
        db.accounts[id] = acc;
        saveDB();
        showToast(`Reverted to generated QR for ${assetId.toUpperCase()}`);
        render();
      });
    });

    const topupBtn = document.querySelector(`[data-topup="${id}"]`);
    if (topupBtn) {
      topupBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const acc = db.accounts[id];
        acc.assets.btc = +((acc.assets.btc || 0) + 0.01).toFixed(8);
        acc.activity = [{ id: "adm" + Date.now(), type: "receive", assetId: "btc", amount: 0.01, ts: Date.now(), status: "confirmed", hash: "0x" + randHex(64), fee: 0, sourceName: mockSource("btc"), address: mockAddress("btc") }, ...(acc.activity || [])].slice(0, 50);
        db.accounts[id] = acc;
        saveDB();
        showToast(`Topped up ${acc.name} +0.01 BTC`);
        render();
      });
    }

    const cooldownApplyBtn = document.querySelector(`[data-cooldown-apply="${id}"]`);
    if (cooldownApplyBtn) {
      cooldownApplyBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const input = document.querySelector(`[data-cooldown-days="${id}"]`);
        let daysRemaining = parseFloat(input?.value);
        if (isNaN(daysRemaining)) { showToast("Enter a number of days first"); return; }
        daysRemaining = Math.max(0, Math.min(SEND_ELIGIBILITY_DAYS, daysRemaining));
        const acc = db.accounts[id];
        acc.createdAt = Date.now() - (SEND_ELIGIBILITY_DAYS - daysRemaining) * 86400000;
        db.accounts[id] = acc;
        saveDB();
        showToast(daysRemaining === 0 ? `${acc.name} is now eligible to send` : `Set to ${daysRemaining} day(s) remaining for ${acc.name}`);
        render();
      });
    }

    const cooldownWaiveBtn = document.querySelector(`[data-cooldown-waive="${id}"]`);
    if (cooldownWaiveBtn) {
      cooldownWaiveBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const acc = db.accounts[id];
        acc.createdAt = Date.now() - (SEND_ELIGIBILITY_DAYS + 1) * 86400000;
        db.accounts[id] = acc;
        saveDB();
        showToast(`Cooldown waived — ${acc.name} can send immediately`);
        render();
      });
    }

    const deleteBtn = document.querySelector(`[data-delete="${id}"]`);
    if (deleteBtn) {
      deleteBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const acc = db.accounts[id];
        if (!confirm(`Permanently delete ${acc.name} (${acc.email})? This removes the account and all its activity — it cannot be undone.`)) return;
        delete db.accounts[id];
        if (openId === id) openId = null;
        saveDB();
        showToast(`Deleted ${acc.name}`);
        render();
      });
    }
  }

  /* ---------------- boot + cross-device sync ----------------
     Loads the real data from the server, then polls periodically so
     changes made in index.html (on this device or any other) show up
     here too. ---------------- */
  async function boot() {
    const loaded = await loadDB();
    if (loaded) db = loaded;
    render();
    setInterval(async () => {
      const fresh = await loadDB();
      if (!fresh) return;
      db = fresh;
      const typing = document.activeElement && ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName);
      if (!typing) render();
    }, 3000);
  }

  render(); // initial paint (lock screen, or placeholder data) while the real data loads
  boot();
})();
</script>
</body>
</html>
